<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pricebench - Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="topbar">
        <div class="topbar__left">
            <a class="brand" href="#">Pricebench</a>
        </div>
        <div class="topbar__right">
            <select class="currency" aria-label="Currency">
                <option>CAD</option>
                <option>USD</option>
                <option>EUR</option>
                <option>GBP</option>
            </select>
            <a class="btn btn--primary" href="#">Login</a>
        </div>
    </header>

    <main class="page">
        <section class="intro">
            <h1>Refurbish. Repair. Sell.</h1>
            <p>Cost it, set your margin, then test any offer before you reply.</p>
        </section>

        <section class="calculator-grid">
            <!-- Left box -->
            <div class="calculator-box">
                <h2 class="calculator-box-title">1. Product details</h2>
                <div class="form-fields">
                    <div class="form-row">
                            <label for="product-name">Product name</label>
                            <input
                                type="text"
                                id="product-name"
                                placeholder="Enter product name">
                    </div>
                    <div class="form-row">
                        <label for="purchase-cost">Purchase cost</label>
                        <div class="input-currency">
                            <input
                                type="number"
                                id="purchase-cost">
                            <span class="form-row-currency">CAD</span>
                        </div>
                    </div>
                </div>
                <hr>
            </div>

            <!-- Right box -->
            <div class="calculator-box"></div>
        </section>
    </main>
</body>
</html>
