<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pricebench - Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="topbar">
        <div class="topbar__left">
            <a class="brand" href="#">Pricebench</a>
        </div>
        <div class="topbar__right">
            <select class="currency" aria-label="Currency">
                <option>CAD</option>
                <option>USD</option>
                <option>EUR</option>
                <option>GBP</option>
            </select>
            <a class="btn btn--primary" href="#">Login</a>
        </div>
    </header>

    <main class="page">
        <section class="intro">
            <h1>Refurbish. Repair. Sell.</h1>
            <p>Cost it, set your margin, then test any offer before you reply.</p>
        </section>
    </main>
</body>
</html>
