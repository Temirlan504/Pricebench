<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pricebench - Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Header -->
    <header class="topbar">
        <div class="topbar__left">
            <a class="brand" href="#">Pricebench</a>
        </div>
        <div class="topbar__right">
            <select class="currency" aria-label="Currency">
                <option>CAD</option>
                <option>USD</option>
                <option>EUR</option>
                <option>GBP</option>
            </select>
            <a class="btn btn--primary" href="#">Login</a>
        </div>
    </header>

    <main class="page">
        <section class="intro">
            <h1>Refurbish. Repair. Sell.</h1>
            <p>Cost it, set your margin, and test any offer before you reply.</p>
        </section>

        <section class="calculator-grid">
            <!-- Left box -->
            <div class="calculator-box">
                <!-- Section 1: Product details -->
                <h2 class="calculator-box-title">1. Product details</h2>
                <div class="form-fields">
                    <div class="form-row">
                        <label for="product-name">Product name</label>
                        <input
                            type="text"
                            id="product-name"
                            placeholder="Enter product name">
                    </div>
                    <div class="form-row">
                        <label for="purchase-cost">Purchase cost</label>
                        <div class="input-currency">
                            <input
                                type="number"
                                id="purchase-cost"
                                placeholder="0.00"
                                min="0"
                                step="0.1">
                            <span class="form-row-currency">CAD</span>
                        </div>
                    </div>
                </div>
                <hr>

                <!-- Section 2: Parts & Expenses -->
                <h2 class="calculator-box-title">2. Parts & Expenses</h2>
                <div id="parts-list">
                    <div class="form-fields">
                        <div class="form-row">
                            <label for="item-name">Item name</label>
                            <input type="text" id="item-name" placeholder="Enter item name">
                        </div>
                        <div class="form-row">
                            <label for="purchase-cost">Purchase cost</label>
                            <div class="input-currency">
                                <input type="number" id="purchase-cost" placeholder="0.00" min="0" step="0.1">
                                <span class="form-row-currency">CAD</span>
                            </div>
                        </div>
                    </div>
                </div>
                <button id="add-part" type="button" class="btn btn--secondary">+ Add</button>
                <hr>

                <!-- Section 3: Marketplace fees & Ads -->
                <h2 class="calculator-box-title">3. Marketplace fees & Ads</h2>
                <div class="expense-row">
                    <div class="form-row">
                        <label for="fee-name">Expense name</label>
                        <input
                            type="text"
                            id="fee-name"
                            placeholder="e.g. eBay fee">
                    </div>

                    <div class="form-row">
                        <label for="fee-value">Amount</label>
                        <div class="amount-control">
                            <input
                                type="number"
                                id="fee-value"
                                min="0"
                                step="0.1"
                                placeholder="0.00">

                            <div class="amount-toggle" role="group"
                                aria-label="Expense calculation type">
                                <button
                                    type="button"
                                    class="amount-toggle__option is-active"
                                    data-type="fixed"
                                    aria-pressed="true">$</button>
                                <button
                                    type="button"
                                    class="amount-toggle__option"
                                    data-type="percentage"
                                    aria-pressed="false">%</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn--secondary">+ Add</button>
                <hr>

                <!-- Section 4: Your profit -->
                <h2 class="calculator-box-title">4. Your profit</h2>
                <div class="profit-control__row">
                    <span class="profit-control__label">
                        Desired profit you want to make after all expenses.
                    </span>

                    <div class="profit-control__input-group">
                        <input
                            type="number"
                            id="profit-margin"
                            min="0"
                            step="0.1"
                            placeholder="0.00"
                            aria-label="Target profit">

                        <div class="amount-toggle" role="group"
                            aria-label="Profit target type">
                            <button
                                type="button"
                                class="amount-toggle__option"
                                data-type="fixed"
                                aria-pressed="false">$</button>

                            <button
                                type="button"
                                class="amount-toggle__option is-active"
                                data-type="percentage"
                                aria-pressed="true">%</button>
                        </div>
                    </div>
                </div>
                <hr>

                <!-- Calculate Button -->
                <button id="calculate-button" type="button" class="btn btn--primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                        <line x1="8" y1="6" x2="16" y2="6"></line>
                        <circle cx="9" cy="11" r="1"></circle>
                        <circle cx="15" cy="11" r="1"></circle>
                        <circle cx="9" cy="16" r="1"></circle>
                        <circle cx="15" cy="16" r="1"></circle>
                    </svg>
                    Calculate
                </button>

            </div>

            <!-- Right box -->
            <div class="calculator-box"></div>
        </section>
    </main>
</body>
</html>
